name: Build APK
# Builds SAB Monitor on every push (and on demand from the Actions tab). Every run uploads
# SAB_Monitor.apk as an artifact. Runs on main also publish it to the "latest" release, which gives
# a stable download link that always has the newest build:
# https://github.com/daveroz/SAB-Monitor/releases/download/latest/SAB_Monitor.apk
#
# Every build is signed with the same key, kept in the SIGNING_KEYSTORE_BASE64 repository secret
# (see README.md), so each new APK installs over the last one.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write # to publish the APK on the release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# Optional: only needed if the key's password or alias isn't android / androiddebugkey.
env:
  SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
  SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
  SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Locate project folder
        run: |
          f=$(find . -name capacitor.config.ts -not -path '*/node_modules/*' | head -1)
          if [ -z "$f" ]; then
            echo "capacitor.config.ts not found - the project files were not uploaded."
            find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          echo "APP_DIR=$(dirname "$f")" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }

      # Without the secret the APK is signed with a throwaway key, so it can't install over an
      # existing one and isn't published.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/signing.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::The SIGNING_KEYSTORE_BASE64 secret isn't set, so this APK is signed with a throwaway key and won't be published to the release. See README.md."
          fi

      - run: npm install
        working-directory: ${{ env.APP_DIR }}
      - run: npm run build
        working-directory: ${{ env.APP_DIR }}
      - run: bash scripts/android-setup.sh
        working-directory: ${{ env.APP_DIR }}
      - name: Assemble debug APK
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleDebug

      - name: Name the APK
        run: cp "${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk" SAB_Monitor.apk

      # The build signs with the runner's own throwaway debug key; this replaces that signature
      # with the fixed key, so the APK can update the installed app.
      - name: Sign with the fixed key
        if: env.SIGNING_KEYSTORE_FILE != ''
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          KS_PASS="${SIGNING_KEYSTORE_PASSWORD:-android}" KEY_PASS="${SIGNING_KEY_PASSWORD:-android}" \
            "$apksigner" sign --ks "$SIGNING_KEYSTORE_FILE" --ks-pass env:KS_PASS \
            --ks-key-alias "${SIGNING_KEY_ALIAS:-androiddebugkey}" --key-pass env:KEY_PASS SAB_Monitor.apk

      # Only an APK signed with the fixed key can update the installed app, so only that one is
      # published.
      - name: Check the signing key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs SAB_Monitor.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          expected=""
          if [ -n "${SIGNING_KEYSTORE_FILE:-}" ]; then
            expected=$(keytool -list -v -keystore "$SIGNING_KEYSTORE_FILE" -storepass "${SIGNING_KEYSTORE_PASSWORD:-android}" \
              -alias "${SIGNING_KEY_ALIAS:-androiddebugkey}" | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          fi
          {
            echo "### SAB Monitor, build ${GITHUB_RUN_NUMBER}"
            echo '```'
            echo "Signer SHA-256: $actual"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$actual" ] && [ "$actual" = "$expected" ]; then
            echo "SIGNED_WITH_FIXED_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::This APK isn't signed with the key in SIGNING_KEYSTORE_BASE64, so it can't update the installed app and won't be published."
          fi

      - uses: actions/upload-artifact@v7
        with:
          path: SAB_Monitor.apk
          archive: false # download the APK itself, not a zip

      - name: Publish to the latest release
        if: env.SIGNED_WITH_FIXED_KEY == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="SAB Monitor (build ${GITHUB_RUN_NUMBER})"
          notes="Built from ${GITHUB_SHA::7}. Installs over the previous version (same signing key)."
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest SAB_Monitor.apk --clobber
            gh release edit latest --title "$title" --notes "$notes"
          else
            gh release create latest SAB_Monitor.apk --title "$title" --notes "$notes" --target "$GITHUB_SHA"
          fi
