name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project folder
        run: |
          f=$(find . -name capacitor.config.ts -not -path '*/node_modules/*' | head -1)
          if [ -z "$f" ]; then
            echo "capacitor.config.ts not found - the project files were not uploaded."
            find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          echo "APP_DIR=$(dirname "$f")" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - run: npm install
        working-directory: ${{ env.APP_DIR }}
      - run: npm run build
        working-directory: ${{ env.APP_DIR }}
      - run: bash scripts/android-setup.sh
        working-directory: ${{ env.APP_DIR }}
      - name: Assemble debug APK
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleDebug

      - name: Name the APK
        run: cp "${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk" "${{ env.APP_DIR }}/SAB_Monitor.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SAB_Monitor
          path: ${{ env.APP_DIR }}/SAB_Monitor.apk
