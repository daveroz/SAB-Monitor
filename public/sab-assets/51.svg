<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#0284c7" flood-opacity="0.45"/>
    </filter>
  </defs>
  <style>
    @keyframes raindrop1 {
      0% { transform: translateY(-2px); opacity: 0; }
      25% { opacity: 1; }
      75% { opacity: 1; }
      100% { transform: translateY(6px); opacity: 0; }
    }
    @keyframes raindrop2 {
      0% { transform: translateY(-2px); opacity: 0; }
      25% { opacity: 1; }
      75% { opacity: 1; }
      100% { transform: translateY(6px); opacity: 0; }
    }
    @keyframes raindrop3 {
      0% { transform: translateY(-2px); opacity: 0; }
      25% { opacity: 1; }
      75% { opacity: 1; }
      100% { transform: translateY(6px); opacity: 0; }
    }
    .drop-1 {
      animation: raindrop1 0.8s linear infinite;
    }
    .drop-2 {
      animation: raindrop2 0.8s linear infinite;
      animation-delay: 0.27s;
    }
    .drop-3 {
      animation: raindrop3 0.8s linear infinite;
      animation-delay: 0.54s;
    }
    .cloud-pulse {
      animation: cloudFloat 2.2s ease-in-out infinite;
    }
    @keyframes cloudFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-0.8px); }
    }
  </style>
  <g class="cloud-pulse">
    <!-- Cloud base -->
    <path d="M9.5 17.5a4.5 4.5 0 0 1-.8-8.9A6.5 6.5 0 0 1 21.2 7a5 5 0 0 1 3.8 10.5H9.5z"
          fill="url(#cloudGrad)"
          stroke="#0284c7"
          stroke-width="1.3"
          stroke-linejoin="round"
          filter="url(#cloudShadow)" />
  </g>
  <!-- Animated raindrops -->
  <g stroke="#06b6d4" stroke-width="2.2" stroke-linecap="round">
    <line class="drop-1" x1="10" y1="19.5" x2="8.5" y2="24" />
    <line class="drop-2" x1="16" y1="20" x2="14.5" y2="24.5" />
    <line class="drop-3" x1="22" y1="19.5" x2="20.5" y2="24" />
  </g>
</svg>
